<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIZUALIZER 3000</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff41;
    --cyan: #00eeff;
    --pink: #ff2d78;
    --orange: #ff6b00;
    --bg: #000;
    --panel: #0a0a0a;
    --border: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.015) 2px, rgba(0,255,65,0.015) 4px);
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 99;
  }

  #app {
    width: 900px;
    max-width: 98vw;
    position: relative;
    z-index: 1;
  }

  /* TITLE BAR */
  #titlebar {
    background: linear-gradient(90deg, #001a00, #003300, #001a00);
    border: 1px solid var(--green);
    border-bottom: none;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  #titlebar .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
  }

  #titlebar .winbtns {
    display: flex;
    gap: 6px;
  }

  #titlebar .winbtn {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0,255,65,0.3);
    background: #001a00;
    cursor: pointer;
  }
  #titlebar .winbtn:hover { background: var(--green); }

  /* MAIN PANEL */
  #main {
    border: 1px solid var(--green);
    border-top: 1px solid rgba(0,255,65,0.3);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* VIZ CANVAS */
  #viz-wrap {
    position: relative;
    height: 280px;
    background: #000;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }

  canvas#viz {
    display: block;
    width: 100%;
    height: 100%;
  }

  #overlay-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    transition: opacity 0.5s;
  }

  #overlay-text.hidden { opacity: 0; pointer-events: none; }

  #overlay-text p {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(0,255,65,0.4);
    text-align: center;
  }

  #start-btn {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 12px 32px;
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    cursor: pointer;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 16px rgba(0,255,65,0.2), inset 0 0 16px rgba(0,255,65,0.05);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  #start-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    opacity: 0;
    transition: opacity 0.2s;
  }

  #start-btn:hover {
    box-shadow: 0 0 30px rgba(0,255,65,0.5), inset 0 0 30px rgba(0,255,65,0.1);
    transform: scale(1.02);
  }

  #start-btn span { position: relative; z-index: 1; }

  /* EQ + INFO BAR */
  #infobar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }

  .info-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #track-display {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
  }

  #level-meters {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 28px;
  }

  .level-bar {
    width: 6px;
    background: #0a2200;
    border-radius: 1px;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .level-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--green);
    transition: height 0.05s;
    box-shadow: 0 0 4px var(--green);
  }

  /* MODE BUTTONS */
  #mode-btns {
    display: flex;
    gap: 2px;
  }

  .mode-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 5px 10px;
    background: transparent;
    border: 1px solid #1a3a1a;
    color: rgba(0,255,65,0.4);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .mode-btn:hover {
    border-color: var(--green);
    color: var(--green);
  }

  .mode-btn.active {
    background: #001800;
    border-color: var(--green);
    color: var(--green);
    text-shadow: 0 0 6px var(--green);
    box-shadow: inset 0 0 10px rgba(0,255,65,0.1);
  }

  /* SENSITIVITY */
  .info-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .sens-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sens-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,65,0.5);
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 90px;
    height: 3px;
    background: #0a2200;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    cursor: pointer;
  }

  /* SPECTRUM MINI */
  #mini-spectrum {
    height: 3px;
    width: 100%;
    display: flex;
    gap: 1px;
    align-items: flex-end;
    overflow: hidden;
  }

  /* STATUS BAR */
  #statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
  }

  #status-left {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,65,0.4);
  }

  #vu-meters {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .vu-label {
    font-size: 9px;
    letter-spacing: 1px;
    color: rgba(0,255,65,0.3);
  }

  .vu-bar {
    width: 60px;
    height: 6px;
    background: #050f05;
    border: 1px solid #0a2200;
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }

  .vu-fill {
    height: 100%;
    width: 0%;
    border-radius: 1px;
    transition: width 0.05s;
  }

  .vu-l .vu-fill { background: linear-gradient(90deg, var(--green), var(--cyan)); box-shadow: 0 0 4px var(--cyan); }
  .vu-r .vu-fill { background: linear-gradient(90deg, var(--green), var(--pink)); box-shadow: 0 0 4px var(--pink); }

  #status-right {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,65,0.4);
  }

  /* Scan line animation */
  @keyframes scanline {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(100vh); }
  }

  #scanline {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(transparent, rgba(0,255,65,0.06), transparent);
    animation: scanline 6s linear infinite;
    pointer-events: none;
    z-index: 101;
  }
</style>
</head>
<body>

<div id="scanline"></div>

<div id="app">
  <div id="titlebar">
    <div class="logo">VIZUALIZER 3000</div>
    <div class="winbtns">
      <div class="winbtn"></div>
      <div class="winbtn"></div>
      <div class="winbtn"></div>
    </div>
  </div>

  <div id="main">
    <div id="viz-wrap">
      <canvas id="viz"></canvas>
      <div id="overlay-text">
        <p>AUDIO INPUT REQUIRED</p>
        <button type="button" id="start-btn"><span>▶ ENABLE MIC</span></button>
        <p>point your mic at the speakers</p>
      </div>
    </div>

    <div id="infobar">
      <div class="info-left">
        <div id="track-display">AWAITING SIGNAL...</div>
        <div id="level-meters"></div>
      </div>

      <div id="mode-btns">
        <button type="button" class="mode-btn active" data-mode="bars">BARS</button>
        <button type="button" class="mode-btn" data-mode="scope">SCOPE</button>
        <button type="button" class="mode-btn" data-mode="fire">FIRE</button>
        <button type="button" class="mode-btn" data-mode="milkdrop">MILK</button>
        <button type="button" class="mode-btn" data-mode="rings">RINGS</button>
      </div>

      <div class="info-right">
        <div class="sens-row">
          <span class="sens-label">GAIN</span>
          <input type="range" id="sens" min="1" max="8" value="4" step="0.5">
          <span class="sens-label" id="sens-val">4.0</span>
        </div>
        <div class="sens-row">
          <span class="sens-label">SMOOTH</span>
          <input type="range" id="smooth" min="0.5" max="0.98" value="0.8" step="0.01">
        </div>
      </div>
    </div>

    <div id="statusbar">
      <div id="status-left">44100 HZ · MONO MIC</div>
      <div id="vu-meters">
        <span class="vu-label">L</span>
        <div class="vu-bar vu-l"><div class="vu-fill" id="vu-l"></div></div>
        <span class="vu-label">R</span>
        <div class="vu-bar vu-r"><div class="vu-fill" id="vu-r"></div></div>
      </div>
      <div id="status-right">-- FPS</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const wrap = document.getElementById('viz-wrap');
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// Build level meter bars
const levelMeters = document.getElementById('level-meters');
const N_LEVEL = 16;
const levelFills = [];
for (let i = 0; i < N_LEVEL; i++) {
  const bar = document.createElement('div');
  bar.className = 'level-bar';
  const fill = document.createElement('div');
  fill.className = 'level-fill';
  bar.appendChild(fill);
  levelMeters.appendChild(bar);
  levelFills.push(fill);
}

let analyser = null;
let dataArray = null;
let timeArray = null;
let mode = 'bars';
let sensitivity = 4;
let smoothing = 0.8;
let running = false;

document.getElementById('start-btn').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = smoothing;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    timeArray = new Uint8Array(analyser.fftSize);
    document.getElementById('overlay-text').classList.add('hidden');
    document.getElementById('track-display').textContent = 'LIVE INPUT · MIC ACTIVE';
    running = true;
    loop();
  } catch(e) {
    document.getElementById('track-display').textContent = 'MIC ACCESS DENIED';
  }
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => { b.classList.remove('active'); });
    btn.classList.add('active');
    mode = btn.dataset.mode;
    firePixels = null;
  });
});

document.getElementById('sens').addEventListener('input', e => {
  sensitivity = parseFloat(e.target.value);
  document.getElementById('sens-val').textContent = sensitivity.toFixed(1);
});

document.getElementById('smooth').addEventListener('input', e => {
  smoothing = parseFloat(e.target.value);
  if (analyser) analyser.smoothingTimeConstant = smoothing;
});

// PEAKS
const NBAR = 80;
const peaks = new Float32Array(NBAR).fill(0);
const peakVel = new Float32Array(NBAR).fill(0);

function getFFT(n) {
  analyser.getByteFrequencyData(dataArray);
  const out = new Float32Array(n);
  const bins = dataArray.length;
  const logMin = Math.log10(20);
  const logMax = Math.log10(20000);
  const nyquist = 22050;
  for (let i = 0; i < n; i++) {
    const freq = Math.pow(10, logMin + (i / n) * (logMax - logMin));
    const b = Math.min(Math.floor((freq / nyquist) * bins), bins - 1);
    out[i] = Math.min(1, (dataArray[b] / 255) * sensitivity / 4);
  }
  return out;
}

function getWave() {
  analyser.getByteTimeDomainData(timeArray);
  const out = new Float32Array(timeArray.length);
  for (let i = 0; i < timeArray.length; i++) {
    out[i] = ((timeArray[i] / 128) - 1) * sensitivity / 4;
  }
  return out;
}

function drawBars() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  // Grid lines
  ctx.strokeStyle = 'rgba(0,255,65,0.05)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(0, H/4*i); ctx.lineTo(W, H/4*i); ctx.stroke();
  }

  const fft = getFFT(NBAR);
  const bw = W / NBAR;

  for (let i = 0; i < NBAR; i++) {
    const v = Math.min(1, fft[i]);
    const bh = v * H * 0.94;
    const x = i * bw;
    const hue = v > 0.8 ? 0 : v > 0.5 ? 30 : 120;
    const sat = 100;
    const lit = 50 + v * 15;

    // Bar glow
    const grad = ctx.createLinearGradient(0, H, 0, H - bh);
    grad.addColorStop(0, `hsla(${hue},${sat}%,${lit}%,0.9)`);
    grad.addColorStop(0.6, `hsla(${Math.max(0,hue-20)},${sat}%,${lit+10}%,0.7)`);
    grad.addColorStop(1, `hsla(180,100%,70%,0.4)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x + 1, H - bh, bw - 2, bh);

    // Reflection
    ctx.fillStyle = `hsla(${hue},${sat}%,${lit}%,0.08)`;
    ctx.fillRect(x + 1, H, bw - 2, Math.min(bh * 0.3, 30));

    // Peak dot
    if (v > peaks[i]) { peaks[i] = v; peakVel[i] = 0; }
    else { peakVel[i] += 0.002; peaks[i] = Math.max(0, peaks[i] - peakVel[i]); }
    const ph = peaks[i] * H * 0.94;
    ctx.fillStyle = peaks[i] > 0.8 ? '#ff2d78' : peaks[i] > 0.5 ? '#ff6b00' : '#00ff41';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 4;
    ctx.fillRect(x + 1, H - ph - 2, bw - 2, 2);
    ctx.shadowBlur = 0;
  }
}

function drawScope() {
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, 0, W, H);

  const wave = getWave();
  const step = wave.length / W;

  // Center line
  ctx.strokeStyle = 'rgba(0,255,65,0.08)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();

  // Glow pass
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(0,255,65,0.15)';
  ctx.lineWidth = 6;
  for (let x = 0; x < W; x++) {
    const i = Math.floor(x * step);
    const y = H/2 + wave[i] * H * 0.44;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Main line
  ctx.beginPath();
  ctx.strokeStyle = '#00ff41';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00ff41';
  ctx.shadowBlur = 8;
  for (let x = 0; x < W; x++) {
    const i = Math.floor(x * step);
    const y = H/2 + wave[i] * H * 0.44;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

let firePixels = null;
function drawFire() {
  if (!firePixels || firePixels.length !== W * (H+2)) {
    firePixels = new Uint8Array(W * (H + 2));
  }
  const fft = getFFT(W);
  for (let x = 0; x < W; x++) {
    const v = fft[x];
    firePixels[(H+1)*W + x] = Math.floor(v * 240 + 10);
    firePixels[H*W + x] = Math.floor(v * 200);
  }
  for (let y = H - 1; y >= 0; y--) {
    for (let x = 0; x < W; x++) {
      const sum = firePixels[(y+1)*W + x] + firePixels[(y+1)*W + ((x-1+W)%W)] + firePixels[(y+1)*W + ((x+1)%W)] + (y+2 <= H ? firePixels[(y+2)*W+x] : 0);
      firePixels[y*W + x] = sum < 4.06 ? 0 : Math.floor(sum / 4.06);
    }
  }
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const v = firePixels[i];
    img.data[i*4]   = Math.min(255, v * 3);
    img.data[i*4+1] = Math.max(0, Math.min(255, v * 2 - 180));
    img.data[i*4+2] = Math.max(0, v - 220) * 8;
    img.data[i*4+3] = v > 0 ? 255 : 0;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.putImageData(img, 0, 0);
}

let milkT = 0;
function drawMilkdrop() {
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(0, 0, W, H);
  const fft = getFFT(32);
  const bass = fft[0];
  const mid = fft[8];
  const high = fft[24];
  const cx = W / 2, cy = H / 2;

  const colors = ['#00ff41', '#00eeff', '#ff2d78', '#ff6b00'];
  for (let ring = 0; ring < 4; ring++) {
    const rad = (40 + ring * 55) * (0.7 + bass * 0.8 + mid * 0.2);
    const n = 4 + ring * 2;
    ctx.beginPath();
    for (let i = 0; i <= n * 8; i++) {
      const a = (i / (n * 8)) * Math.PI * 2;
      const freq = ring < 2 ? bass : ring === 2 ? mid : high;
      const warp = 1 + 0.35 * Math.sin(n * a + milkT * (0.8 + ring * 0.5)) * freq;
      const r2 = rad * warp * (1 + 0.1 * Math.sin(milkT * 1.3 + ring));
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    }
    ctx.closePath();
    ctx.strokeStyle = colors[ring];
    ctx.lineWidth = 1.2;
    ctx.shadowColor = colors[ring];
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  milkT += 0.03;
}

let ringsT = 0;
function drawRings() {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 0, W, H);
  const fft = getFFT(64);
  const cx = W/2, cy = H/2;
  const maxR = Math.min(W, H) * 0.45;
  const RINGS = 64;
  for (let i = 0; i < RINGS; i++) {
    const v = fft[Math.floor(i * fft.length / RINGS)];
    const r = (i / RINGS) * maxR;
    const hue = (i / RINGS) * 180 + ringsT * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, r + v * 30, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${hue},100%,60%,${v * 0.8 + 0.05})`;
    ctx.lineWidth = 0.5 + v * 2;
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = v * 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ringsT += 0.01;
}

// VU & level meters
function updateMeters(fft) {
  // Level bars (mini EQ)
  for (let i = 0; i < N_LEVEL; i++) {
    const v = fft[Math.floor(i * fft.length / N_LEVEL)] || 0;
    const h = Math.min(100, v * 100);
    const hue = v > 0.8 ? 0 : v > 0.5 ? 30 : 120;
    levelFills[i].style.height = h + '%';
    levelFills[i].style.background = `hsl(${hue},100%,50%)`;
    levelFills[i].style.boxShadow = h > 20 ? `0 0 4px hsl(${hue},100%,50%)` : 'none';
  }
  // VU
  const half = fft.length / 2;
  let sumL = 0, sumR = 0;
  for (let i = 0; i < half; i++) sumL += fft[i];
  for (let i = half; i < fft.length; i++) sumR += fft[i];
  const avgL = sumL / half;
  const avgR = sumR / half;
  document.getElementById('vu-l').style.width = Math.min(100, avgL * 200) + '%';
  document.getElementById('vu-r').style.width = Math.min(100, avgR * 200) + '%';
}

let frameCount = 0, lastFPS = performance.now();
function loop() {
  if (!running) return;
  frameCount++;
  const now = performance.now();
  if (now - lastFPS > 1000) {
    document.getElementById('status-right').textContent = frameCount + ' FPS';
    frameCount = 0; lastFPS = now;
  }

  if (!analyser) { requestAnimationFrame(loop); return; }

  const fft = getFFT(N_LEVEL);
  updateMeters(fft);

  if (mode === 'bars') drawBars();
  else if (mode === 'scope') drawScope();
  else if (mode === 'fire') drawFire();
  else if (mode === 'milkdrop') drawMilkdrop();
  else if (mode === 'rings') drawRings();

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
