<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hyprview logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262633"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa7ff"/>
      <stop offset="1" stop-color="#5a7dff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Workspace cards -->
  <g stroke-width="4">
    <rect x="88" y="112" width="148" height="112" rx="18" fill="#2d2d3c" stroke="#ffffff1f"/>
    <rect x="276" y="112" width="148" height="112" rx="18" fill="#2d2d3c" stroke="#ffffff1f"/>
    <rect x="88" y="268" width="148" height="112" rx="18" fill="#2d2d3c" stroke="#ffffff1f"/>
    <rect x="276" y="268" width="148" height="112" rx="18" fill="#3b3b57" stroke="url(#accent)" stroke-width="8"/>
  </g>

  <!-- Window panes inside each card -->
  <g fill="#484860">
    <rect x="104" y="128" width="56" height="80" rx="8"/>
    <rect x="168" y="128" width="52" height="80" rx="8"/>
    <rect x="292" y="128" width="52" height="80" rx="8"/>
    <rect x="352" y="128" width="56" height="80" rx="8"/>
    <rect x="104" y="284" width="52" height="80" rx="8"/>
    <rect x="164" y="284" width="56" height="80" rx="8"/>
  </g>
  <g fill="#5c5c80">
    <rect x="292" y="284" width="56" height="80" rx="8"/>
    <rect x="356" y="284" width="52" height="80" rx="8"/>
  </g>

  <!-- Focus indicator -->
  <circle cx="420" cy="300" r="12" fill="url(#accent)"/>
</svg>
